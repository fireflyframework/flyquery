      tags:
      - SqlExecute
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/sql:execute/stream:
    post:
      description: |-
        Event sequence:
        1. ``ast_classified`` — AST result + scope check outcome
        2. ``executed``       — DuckDB result
        3. ``final``          — full SqlExecuteResponse JSON

        :param http_request: Starlette request
        :param body: validated SqlExecuteRequest
        :return: StreamingResponse with ``text/event-stream``
      operationId: execute_stream
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlExecuteRequest"
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: One SSE frame per event. Frames carry ``event:`` + ``data:``
                  (JSON-encoded) lines.
                format: event-stream
                type: string
          description: "Server-Sent Events stream. Each frame follows the SSE wire\
            \ format ``event: <name>\\ndata: <json>\\n\\n``. See ``docs/api-reference.md``\
            \ section 8 for the per-endpoint event catalogue."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Execute SQL and stream progress as Server-Sent Events.
      tags:
      - SqlExecute
      x-content-type: application/json
      x-accepts:
      - application/json
      - text/event-stream
