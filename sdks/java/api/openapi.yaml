        ``status`` is always ``"accepted"`` (mirrors the workspaces purge
        contract). ``tombstone_expires_at`` is a human-readable hint --
        consumers receive an ISO-8601 timestamp when the retention job
        actually deletes the SQL row; today the value is the ``+90d``
        placeholder (90 days mirrors ``conv_ttl_days``).
      example:
        tombstone_expires_at: tombstone_expires_at
        status: accepted
      properties:
        status:
          default: accepted
          description: Always 'accepted' for 202 responses.
          title: Status
          type: string
        tombstone_expires_at:
          description: When the SQL row is expected to be hard-deleted. ISO-8601 once
            a retention job is wired; today returns a coarse hint such as '+90d'.
          title: Tombstone Expires At
          type: string
      required:
      - tombstone_expires_at
      title: PurgeAccepted
