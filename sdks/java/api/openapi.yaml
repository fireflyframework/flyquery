openapi: 3.1.0
info:
  contact:
    name: Firefly Framework
    url: https://github.com/fireflyframework/flyquery
  description: Operational Structured-Data Intelligence (upload-driven) -- multi-tenant
    ingestion + Text-to-SQL over user-uploaded structured files (CSV / TSV / XLSX
    / XLS / ODS / JSON / JSONL / Parquet / Avro / ORC / Arrow / Feather + .gz/.zip/.bz2
    variants). Materialises uploads to Parquet on object storage; indexes a long-lived
    schema knowledge base; answers natural-language questions via a multi-agent pipeline.
    Part of Firefly Framework.
  license:
    name: Apache-2.0
    url: https://github.com/fireflyframework/flyquery/blob/main/LICENSE
  title: flyquery
  version: 26.10.4
servers:
- description: This service
  url: /
tags:
- name: AgentConversations
- name: AgentDatasets
- name: AgentExamples
- name: AgentGlossary
- name: AgentIngestJobs
- name: AgentQuery
- name: AgentRelations
- name: AgentSemanticDimensions
- name: AgentSemanticMetrics
- name: AgentSqlExecute
- name: AgentTables
- name: AgentTokens
- name: AuditEvents
- name: Billing
- name: Conversations
- name: CostEvents
- name: Datasets
- name: Examples
- name: Files
- name: Glossary
- name: IngestJobs
- name: Queries
- description: "Hybrid search + grounded retrieval-augmented answering. ``/search``\
    \ returns the raw RRF-fused hit list (BM25 + dense vectors). ``/query`` runs the\
    \ same retrieval, then asks the configured answer model to write an answer using\
    \ ONLY the retrieved chunks -- citations include only the chunks the model actually\
    \ relied on. Both surfaces share the same filter model (source_id, knowledge_item_id,\
    \ domain, jurisdiction, tags, statuses)."
  name: Query
- name: Relations
- name: SchemaChanges
- name: SchemaObjects
- name: SemanticDimensions
- name: SemanticMetrics
- name: SqlExecute
- name: Stats
- name: Tables
- name: TablesDerive
- name: AgentVersion
- description: "Service identity, model selection, and backend choices. Surfaces the\
    \ deployed CalVer, the embedding + answer model ids actually in use, the vector\
    \ backend (pgvector by default), and the EDA adapter. Used by smoke tests and\
    \ operations dashboards."
  name: Version
- name: Workspaces
paths:
  /api/v1/agent-tokens:
    get:
      description: |-
        Returns the summary shape only -- the secret is never
        round-tripped on this endpoint.
      operationId: list_tokens
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AgentTokenSummaryDto"
                type: array
          description: Successful response
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: List tokens for the current tenant (newest first).
      tags:
      - AgentTokens
      x-accepts:
      - application/json
    post:
      description: |-
        Returns 201 with the full ``token`` populated. The token is
        only returned this once -- subsequent reads expose only
        ``prefix``. Refuses agent-tier callers with
        ``403 agent_cannot_mint``.
      operationId: mint
      parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenMintRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenCreated"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Mint a new agent token.
      tags:
      - AgentTokens
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent-tokens/{token_id}:
    delete:
      description: Unknown ``token_id`` returns ``404 resource_not_found``.
      operationId: revoke
      parameters:
      - explode: false
        in: path
        name: token_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/TenantIdHeader"
      - $ref: "#/components/parameters/WorkspaceIdHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: No Content
      security:
      - TenantContext: []
        WorkspaceContext: []
      summary: Revoke a token. Idempotent -- already-revoked is a no-op (204).
      tags:
      - AgentTokens
      x-accepts:
      - application/json
  /api/v1/agent/conversations:
    get:
      operationId: list_conversations
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[ConversationRead]"
          description: Successful response
      security:
      - AgentToken: []
      summary: List conversations for the agent's workspace (newest first).
      tags:
      - AgentConversations
      x-accepts:
      - application/json
    post:
      description: |-
        Replay-dedup'd via ``Idempotency-Key`` (required). A retried
        create otherwise allocates duplicate empty conversations the
        agent has no way to clean up.
      operationId: create
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Create a conversation owned by the calling agent.
      tags:
      - AgentConversations
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/conversations/{conversation_id}:
    get:
      operationId: read
      parameters:
      - explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
          description: Successful response
      security:
      - AgentToken: []
      summary: Fetch a conversation with its turns.
      tags:
      - AgentConversations
      x-accepts:
      - application/json
  /api/v1/agent/conversations/{conversation_id}/turn:
    post:
      description: |-
        Two scopes are required at the agent layer:
        ``flyquery.conversations:write`` (this is a mutating turn
        write) and the underlying ``flyquery.query:read`` (the pipeline
        executes a query). We verify the conversations scope here and
        delegate the query-tier check to the pipeline's scope guard.

        Replay-dedup'd via ``Idempotency-Key`` (required) -- the
        4-agent pipeline is the costliest endpoint in the API.
      operationId: post_turn
      parameters:
      - explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationTurnRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run a drill-down turn through the full query pipeline.
      tags:
      - AgentConversations
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/datasets:
    get:
      operationId: list_datasets
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          default: null
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[DatasetRead]"
          description: Successful response
      security:
      - AgentToken: []
      summary: Search / filter datasets visible to this agent's tenant.
      tags:
      - AgentDatasets
      x-accepts:
      - application/json
  /api/v1/agent/datasets/by-name/{name}:
    get:
      operationId: read_by_name
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
      security:
      - AgentToken: []
      summary: "Resolve a dataset by ``(tenant, workspace, name)``."
      tags:
      - AgentDatasets
      x-accepts:
      - application/json
  /api/v1/agent/datasets/{dataset_id}:
    get:
      operationId: read
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRead"
          description: Successful response
      security:
      - AgentToken: []
      summary: Fetch a single dataset by id.
      tags:
      - AgentDatasets
      x-accepts:
      - application/json
  /api/v1/agent/datasets/{dataset_id}/relations:
    get:
      operationId: list_relations
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[RelationRead]"
          description: Successful response
      security:
      - AgentToken: []
      tags:
      - AgentRelations
      x-accepts:
      - application/json
  /api/v1/agent/datasets/{dataset_id}/tables:
    get:
      operationId: list_tables
      parameters:
      - explode: false
        in: path
        name: dataset_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[TableRead]"
          description: Successful response
      security:
      - AgentToken: []
      tags:
      - AgentTables
      x-accepts:
      - application/json
  /api/v1/agent/examples:
    get:
      description: |-
        :param http_request: Starlette request
        :param quality: optional quality filter (PROPOSED/APPROVED/REJECTED)
        :param dataset_id: optional dataset filter
        :param limit: page size (default 100)
        :param offset: starting offset (default 0)
        :return: Paginated[ExampleRead]
      operationId: list_examples
      parameters:
      - explode: true
        in: query
        name: quality
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: dataset_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[ExampleRead]"
          description: Successful response
      security:
      - AgentToken: []
      summary: List examples for the caller's workspace (agent-tier).
      tags:
      - AgentExamples
      x-accepts:
      - application/json
    post:
      description: |-
        Replay-dedup'd via ``Idempotency-Key`` (required). Without
        this gate an agent retrying a network blip would persist
        duplicate (question, SQL) PROPOSED rows that an operator
        would then have to manually reject.
      operationId: create
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: "Create an example (agent-tier — source=AGENT_LEARNED, quality=PROPOSED)."
      tags:
      - AgentExamples
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/glossary:
    get:
      operationId: list_terms
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated[GlossaryTermRead]"
          description: Successful response
      security:
      - AgentToken: []
      summary: List glossary terms for the caller's workspace (agent-tier).
      tags:
      - AgentGlossary
      x-accepts:
      - application/json
    post:
      operationId: create
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlossaryTermCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryTermRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Create a glossary term (agent-tier).
      tags:
      - AgentGlossary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/glossary/{term_id}:
    delete:
      operationId: delete
      parameters:
      - explode: false
        in: path
        name: term_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: No Content
      security:
      - AgentToken: []
      summary: Hard-delete a glossary term (agent-tier).
      tags:
      - AgentGlossary
      x-accepts:
      - application/json
    get:
      operationId: get_term
      parameters:
      - explode: false
        in: path
        name: term_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryTermRead"
          description: Successful response
      security:
      - AgentToken: []
      summary: Fetch a single glossary term (agent-tier).
      tags:
      - AgentGlossary
      x-accepts:
      - application/json
    put:
      operationId: update
      parameters:
      - explode: false
        in: path
        name: term_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlossaryTermUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryTermRead"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Sparse-update a glossary term (agent-tier).
      tags:
      - AgentGlossary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/ingest-jobs:
    get:
      operationId: list_jobs
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobListResponse"
          description: Successful response
      security:
      - AgentToken: []
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
    post:
      operationId: create_job
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Successful response
      security:
      - AgentToken: []
      summary: Start a background ingestion job (REPARSE/SAMPLE_REFRESH/...).
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
  /api/v1/agent/ingest-jobs/{job_id}:
    get:
      operationId: get_job
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobRead"
          description: Successful response
      security:
      - AgentToken: []
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
  /api/v1/agent/ingest-jobs/{job_id}/events:
    get:
      operationId: list_events
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventListResponse"
          description: Successful response
      security:
      - AgentToken: []
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
  /api/v1/agent/ingest-jobs/{job_id}/stream:
    get:
      operationId: stream_job
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Successful response
      security:
      - AgentToken: []
      summary: "SSE progress stream. The underlying delegate handles framing,"
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
  /api/v1/agent/ingest-jobs/{job_id}:cancel:
    post:
      description: |-
        Replay-dedup'd via ``Idempotency-Key`` (required). The
        underlying service is itself idempotent on terminal jobs, but
        we still cache the response so a retried cancel returns the
        same wire envelope (same ``status`` field).
      operationId: cancel_job
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
          description: Successful response
      security:
      - AgentToken: []
      summary: Cooperatively cancel a running job.
      tags:
      - AgentIngestJobs
      x-accepts:
      - application/json
  /api/v1/agent/query:
    post:
      description: |-
        Replay-dedup'd via ``Idempotency-Key``. The header is *required*
        on the agent surface so an at-least-once delivery agent (which
        retries on network error) doesn't burn budget by re-running the
        same multi-LLM pipeline twice.

        :param http_request: Starlette request (provides tenant context + agent token)
        :param body: validated QueryRequest
        :return: AnswerResponse
      operationId: query
      parameters:
      - $ref: "#/components/parameters/AgentTokenHeader"
      - $ref: "#/components/parameters/CorrelationIdHeader"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - AgentToken: []
      summary: Run the full NL → SQL → result pipeline (agent-tier).
      tags:
      - AgentQuery
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/agent/query/stream:
    post:
      description: |-
        :param http_request: Starlette request
        :param body: validated QueryRequest
