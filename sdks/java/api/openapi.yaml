              schema:
                $ref: "#/components/schemas/SqlExecuteResponse"
          description: Successful response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - TenantContext: []
        WorkspaceContext: []
