[project]
name = "flyquery_sdk"
version = "26.10.4"
description = "Async-first Python client for flyquery — Tabular Intelligence: Text-to-SQL service over user-uploaded structured files."
authors = [
  { name = "Firefly Software Foundation", email = "team@firefly.io" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = [
  "flyquery",
  "tabular-intelligence",
  "text-to-sql",
  "nl2sql",
  "openapi-client",
  "asyncio",
  "duckdb",
  "fireflyframework",
]
requires-python = ">=3.9"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "python-dateutil (>=2.8.2)",
  "aiohttp (>=3.8.4)",
  "aiohttp-retry (>=2.8.3)",
  "pydantic (>=2.11)",
  "typing-extensions (>=4.7.1)",
  # The hand-written ``FlyqueryClient`` ergonomic wrapper uses httpx
  # for bulk + batch endpoints (multi-part fan-out) that the
  # generated aiohttp surface can't express compactly.
  "httpx (>=0.28)",
]

[project.optional-dependencies]
# Surfaced as ``uv pip install ".[dev]"`` (or ``uv sync --extra dev``).
# Mirrors the canon SDK dev extras so the CI pr-gate sdk-python job
# has a consistent dev environment across both services.
dev = [
  "pytest>=7.2.1",
  "pytest-cov>=2.8.1",
  "pytest-asyncio>=0.21",
  "ruff>=0.8",
  "mypy>=1.5",
  "types-python-dateutil>=2.8.19.14",
]

[project.urls]
Homepage      = "https://github.com/fireflyframework/flyquery"
Repository    = "https://github.com/fireflyframework/flyquery"
Documentation = "https://github.com/fireflyframework/flyquery/blob/main/docs/README.md"
Issues        = "https://github.com/fireflyframework/flyquery/issues"
Changelog     = "https://github.com/fireflyframework/flyquery/blob/main/CHANGELOG.md"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">= 7.2.1"
pytest-cov = ">= 2.8.1"
tox = ">= 3.9.0"
flake8 = ">= 4.0.0"
types-python-dateutil = ">= 2.8.19.14"
mypy = ">= 1.5"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "flyquery_sdk",
  #"test",  # auto-generated tests
  "tests", # hand-written tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
extra_checks = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "flyquery_sdk.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
